<text x="468.0" y="1009" font-size="13.5" fill="#555">(Documento da Compra)</text>
<rect x="38" y="700" width="372" height="228" rx="8" fill="#f7fbff" stroke="#1565c0" stroke-width="1.6"/>
<text x="56" y="728" font-size="14.5" font-weight="700" fill="#1f3864">COMO LER O DIAGRAMA</text>
<text x="56" y="754" font-size="12.5" fill="#333">1  O cliente consulta o estoque e recebe os veículos disponíveis.</text>
<text x="56" y="774" font-size="12.5" fill="#333">2  Escolhido o carro, ele inicia a compra.</text>
<text x="56" y="794" font-size="12.5" fill="#333">3  Define retirada na loja ou entrega; o sistema calcula o frete.</text>
<text x="56" y="814" font-size="12.5" fill="#333">4  Escolhe a data e o horário do atendimento.</text>
<text x="56" y="834" font-size="12.5" fill="#333">5  Paga por PIX, boleto ou cartão.</text>
<text x="56" y="854" font-size="12.5" fill="#333">6  Confirma a compra: o status vira “Concluída”, o comprovante</text>
<text x="56" y="874" font-size="12.5" fill="#333">     é gerado e o veículo passa a “Vendido”.</text>
<text x="56" y="894" font-size="12.5" fill="#333">7  O comprovante é enviado ao cliente.</text>
<text x="56" y="914" font-size="12.5" fill="#333">8/9  O administrador mantém o estoque e acompanha os pedidos.</text>
<rect x="38" y="946" width="372" height="198" rx="6" fill="#ffffff" stroke="#666" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="56" y="974" font-size="14.5" font-weight="700" fill="#1a1a1a">PRINCIPAIS REQUISITOS ATENDIDOS</text>
<text x="56" y="1000" font-size="12.5" fill="#333">• RF03 / RF04 – Listagem e detalhamento dos veículos</text>
<text x="56" y="1018" font-size="12.5" fill="#333">• RF05 / RF06 – Início da compra e dados do cliente</text>
<text x="56" y="1036" font-size="12.5" fill="#333">• RF07 / RF08 – Retirada ou entrega e cálculo do frete</text>
<text x="56" y="1054" font-size="12.5" fill="#333">• RF09 – Agendamento de data e horário</text>
<text x="56" y="1072" font-size="12.5" fill="#333">• RF10 a RF14 – Pagamento e registro do status</text>
<text x="56" y="1090" font-size="12.5" fill="#333">• RF15 – Geração do comprovante</text>
<text x="56" y="1108" font-size="12.5" fill="#333">• RF16 / RF17 – Administração do estoque e dos pedidos</text>
<text x="56" y="1126" font-size="12.5" fill="#333">• RF18 – Veículo alterado para vendido</text>
