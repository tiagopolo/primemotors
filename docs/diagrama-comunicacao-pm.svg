<text x="62" y="978" font-size="14.5" font-weight="700" fill="#1a1a1a">PRINCIPAIS REQUISITOS ATENDIDOS</text>
<text x="62" y="1004" font-size="12.5" fill="#333">• RF03 – Listagem dos veículos disponíveis</text>
<text x="62" y="1022" font-size="12.5" fill="#333">• RF04 – Detalhamento do veículo</text>
<text x="62" y="1040" font-size="12.5" fill="#333">• RF05 / RF06 – Início da compra e dados do cliente</text>
<text x="62" y="1058" font-size="12.5" fill="#333">• RF07 / RF08 – Retirada ou entrega e cálculo do frete</text>
<text x="62" y="1076" font-size="12.5" fill="#333">• RF09 – Agendamento de data e horário</text>
<text x="62" y="1094" font-size="12.5" fill="#333">• RF10 a RF14 – Pagamento e registro do status</text>
<text x="62" y="1112" font-size="12.5" fill="#333">• RF15 – Geração do comprovante</text>
<text x="62" y="1130" font-size="12.5" fill="#333">• RF16 / RF17 – Administração do estoque e dos pedidos</text>
<text x="62" y="1148" font-size="12.5" fill="#333">• RF18 – Veículo alterado para vendido</text>
